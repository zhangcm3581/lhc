# 放到服务器的 /etc/nginx/conf.d/lhc.conf，然后 nginx -t && systemctl reload nginx
# 访问地址：http://服务器IP:8080
server {
    listen 8080;
    server_name _;
    root /opt/lhc/web;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css;

    # 抓取脚本每天改写 draws.json，不能缓存
    location /data/ {
        alias /opt/lhc/data/;
        add_header Cache-Control "no-cache";
    }

    # 打包后的文件名带哈希，可以长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

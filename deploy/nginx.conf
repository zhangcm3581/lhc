# 由 setup-server.sh 安装到 /etc/nginx/sites-available/lhc，并链接到 sites-enabled。
# 端口默认 8091（可用 LHC_PORT 指定），不和服务器上已有的站点冲突。
# 网页：仓库里打包好的 web/dist（git pull 即更新）；数据：仓库外的 /opt/lhc-data（每天抓取写入，不受 git 影响）
server {
    listen 8091;
    server_name _;
    root /opt/lhc/web/dist;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css;

    # 抓取脚本每天改写 draws.json，不能缓存
    location /data/ {
        alias /opt/lhc-data/;
        add_header Cache-Control "no-cache";
    }

    # 打包后的文件名带哈希，可以长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
